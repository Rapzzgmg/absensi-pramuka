<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Pramuka Attendance System</title><meta name="color-scheme" content="light dark">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
:root{--bg:#f3f7f4;--card:#fff;--tx:#12261c;--mu:#5d7367;--g:#0b5d3b;--e:#10b981;--au:#c9a227;--bd:#dfe8e2;--rd:#dc2626;--bt:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#0c1511;--card:#15231b;--tx:#e8f2ec;--mu:#8fa89a;--bd:#243a2d;--g:#10b981;--bt:#04150d}}
*{box-sizing:border-box}html,body{margin:0}body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:14px}
button,input,select{font:inherit;color:inherit}
.side{position:fixed;inset:0 auto 0 0;width:220px;background:linear-gradient(180deg,#073d27,#0b5d3b);color:#fff;padding:18px 12px;display:flex;flex-direction:column;gap:4px;padding-top:calc(18px + env(safe-area-inset-top,0px))}
.brand{font-weight:800;font-size:15px;line-height:1.2;padding:0 8px 14px}.brand small{display:block;color:#e6c85a;font-weight:600;font-size:10px;margin-top:4px}
.nav{background:none;border:0;color:#cfe8da;text-align:left;padding:10px 12px;border-radius:10px;cursor:pointer;white-space:nowrap}.nav.on,.nav:hover{background:rgba(255,255,255,.14);color:#fff}
main{margin-left:220px;padding:0 22px 40px}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 0;gap:10px;flex-wrap:wrap}.top h1{margin:0;font-size:20px}.top span{color:var(--mu);font-size:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px}.stat b{display:block;font-size:26px;color:var(--g)}.stat span{color:var(--mu);font-size:12px}
.btn{background:var(--g);color:var(--bt);border:0;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer}.btn.o{background:none;color:var(--g);border:1px solid var(--g)}.btn.r{background:var(--rd);color:#fff}.btn.s{padding:5px 9px;font-size:12px}
input,select{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 11px;width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.row>*{flex:1;min-width:120px}.row>.btn{flex:0 0 auto}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--bd);font-size:13px}th{color:var(--mu);font-weight:600;font-size:12px}.sc{overflow-x:auto}
.bars{display:flex;align-items:flex-end;gap:10px;height:140px}.bars div{flex:1;text-align:center;font-size:11px;color:var(--mu)}.bars i{display:block;background:linear-gradient(var(--e),var(--g));border-radius:6px 6px 0 0;margin-bottom:4px}
.tag{background:rgba(16,185,129,.15);color:var(--g);border-radius:20px;padding:2px 9px;font-size:11px;font-weight:600}
#reader{width:100%;max-width:380px;margin:0 auto;border-radius:12px;overflow:hidden}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:12px 18px;border-radius:12px;color:#fff;font-weight:600;z-index:9;max-width:90%;display:none}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}.idc{border:2px solid var(--g);border-radius:12px;padding:12px;text-align:center;background:var(--card)}.idc h4{margin:0;font-size:11px;color:var(--g)}.idc .qr{display:flex;justify-content:center;margin:8px 0;background:#fff;padding:6px;border-radius:8px}.idc b{display:block}.idc small{color:var(--mu)}
.login{max-width:360px;margin:12vh auto;padding:0 16px}.login h1{color:var(--g);margin:0}.login p{color:var(--mu)}
@media(max-width:760px){.side{position:static;width:auto;flex-direction:row;overflow-x:auto;padding:10px;padding-top:calc(10px + env(safe-area-inset-top,0px))}.brand{display:none}main{margin:0;padding:0 14px 40px}}
@media print{.side,.top .btn,.noprint{display:none!important}main{margin:0}}
</style></head><body><div id="app"></div><div id="toast"></div>
<script>
const KEY='pas_v1',$=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let db,user=null,view='dash',q='',pg=0,fs='',scn=null,lock=false,sesId=null;
function load(){try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!db)db={students:[['Ahmad Fauzi','0012345601','VII A','Garuda'],['Siti Nurhaliza','0012345602','VII B','Elang'],['Budi Santoso','0012345603','VIII A','Garuda'],['Dewi Lestari','0012345604','VIII B','Merpati'],['Rizky Pratama','0012345605','IX A','Elang'],['Putri Ayu','0012345606','IX B','Merpati']].map((a,i)=>({name:a[0],nis:a[1],cls:a[2],regu:a[3],no:'PRM-'+String(i+1).padStart(4,'0')})),
teachers:[{u:'admin',p:'admin123',n:'Super Admin',r:'admin'},{u:'guru',p:'guru123',n:'Pembina Budi',r:'guru'}],sessions:[],att:[],cfg:{school:'Nama Sekolah',lat:-6.2,lng:106.816,rad:100,on:true}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
function toast(m,t){const e=$('#toast');e.textContent=m;e.style.background=t=='err'?'#dc2626':t=='warn'?'#b7791f':'#0b5d3b';e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',3000)}
const dt=t=>new Date(t).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'});
const adm=()=>user&&user.r=='admin';
function gps(){return new Promise((ok,no)=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>ok(p.coords),no,{enableHighAccuracy:true,timeout:12000,maximumAge:0}):no())}
function dist(a,b,c,d){const R=6371e3,r=x=>x*Math.PI/180,h=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function login(){const u=db.teachers.find(t=>t.u==$('#lu').value.trim()&&t.p==$('#lp').value);if(!u)return toast('Username atau password salah','err');user=u;view='dash';render()}
function go(v){stopScan();view=v;q='';pg=0;render()}
async function stopScan(){if(scn){try{await scn.stop()}catch(e){}scn=null}}
function render(){
if(!user){$('#app').innerHTML=`<div class="login"><h1>PRAMUKA ATTENDANCE SYSTEM</h1><p>Disiplin, Terdata, dan Terintegrasi.</p><div class="card"><div class="row"><input id="lu" placeholder="Username"></div><div class="row"><input id="lp" type="password" placeholder="Password"></div><div class="row"><button class="btn" onclick="login()">Masuk</button></div><small style="color:var(--mu)">Demo: admin / admin123 · guru / guru123</small></div></div>`;return}
const nav=[['dash','Dashboard'],['scan','Scan QR'],['ses','Sesi'],['stu','Anggota'],['his','Riwayat']].concat(adm()?[['gur','Guru'],['cfg','Lokasi']]:[]);
$('#app').innerHTML=`<aside class="side"><div class="brand">PRAMUKA<br>ATTENDANCE<small>Disiplin, Terdata, Terintegrasi</small></div>${nav.map(n=>`<button class="nav ${view==n[0]?'on':''}" onclick="go('${n[0]}')">${n[1]}</button>`).join('')}<button class="nav" onclick="stopScan();user=null;render()">Keluar</button></aside><main><div class="top"><div><h1>${nav.find(n=>n[0]==view)[1]}</h1><span>${new Date().toLocaleDateString('id-ID',{dateStyle:'full'})}</span></div><span>${esc(user.n)} · <span class="tag">${adm()?'Super Admin':'Pembina'}</span></span></div><div id="v"></div></main>`;
$('#v').innerHTML=V[view]();if(view=='scan')startScan();if(view=='stu')qrs()}
function qrs(){document.querySelectorAll('.qr[data-c]').forEach(e=>{e.innerHTML='';try{new QRCode(e,{text:e.dataset.c,width:120,height:120})}catch(x){}})}
const V={
dash(){const today=new Date().toDateString(),ta=db.att.filter(a=>new Date(a.t).toDateString()==today).length,last=db.sessions.slice(-7),mx=Math.max(1,db.students.length);
return `<div class="grid"><div class="card stat"><b>${db.students.length}</b><span>Anggota</span></div><div class="card stat"><b>${db.sessions.length}</b><span>Sesi kegiatan</span></div><div class="card stat"><b>${ta}</b><span>Hadir hari ini</span></div><div class="card stat"><b>${db.sessions.length?Math.round(db.att.length/(db.sessions.length*mx)*100):0}%</b><span>Rata-rata kehadiran</span></div></div><div class="card"><b>Kehadiran 7 sesi terakhir</b><br><br>${last.length?`<div class="bars">${last.map(s=>{const n=db.att.filter(a=>a.sid==s.id).length;return `<div><i style="height:${Math.max(4,n/mx*110)}px"></i>${n}<br>${esc(s.name.slice(0,8))}</div>`}).join('')}</div>`:'<span style="color:var(--mu)">Belum ada sesi. Buat di menu Sesi.</span>'}</div>`},
ses(){return `<div class="card"><div class="row"><input id="sn" placeholder="Nama kegiatan, mis. Latihan Rutin Jumat"><button class="btn" onclick="addSes()">Buat Sesi</button></div></div><div class="card sc"><table><tr><th>Kegiatan</th><th>Dibuat</th><th>Hadir</th><th>Status</th><th></th></tr>${db.sessions.slice().reverse().map(s=>`<tr><td>${esc(s.name)}</td><td>${dt(s.t)}</td><td>${db.att.filter(a=>a.sid==s.id).length}</td><td><span class="tag">${s.open?'Dibuka':'Selesai'}</span></td><td>${s.open?`<button class="btn s" onclick="useSes(${s.id})">Scan</button> <button class="btn o s" onclick="closeSes(${s.id})">Tutup</button>`:''}</td></tr>`).join('')||'<tr><td colspan=5>Belum ada sesi</td></tr>'}</table></div>`},
scan(){const o=db.sessions.filter(s=>s.open);return `<div class="card"><div class="row"><select id="ss" onchange="sesId=+this.value">${o.map(s=>`<option value="${s.id}" ${s.id==sesId?'selected':''}>${esc(s.name)}</option>`).join('')||'<option value="">Tidak ada sesi aktif</option>'}</select></div><div id="reader"></div><div class="row" style="margin-top:10px"><input id="man" placeholder="Input manual: nomor anggota (PRM-0001)"><button class="btn o" onclick="proc('PRAMUKA:'+$('#man').value.trim().toUpperCase())">Kirim</button></div><small style="color:var(--mu)">Absen hanya diproses jika perangkat guru berada dalam radius sekolah (${db.cfg.on?db.cfg.rad+' m':'validasi GPS nonaktif'}).</small></div><div class="card"><b>Hasil scan terbaru</b><div class="sc"><table id="rs">${recent()}</table></div></div>`},
stu(){const l=db.students.filter(s=>(s.name+s.nis+s.cls+s.regu+s.no).toLowerCase().includes(q.toLowerCase())),pp=8,pgs=Math.max(1,Math.ceil(l.length/pp));pg=Math.min(pg,pgs-1);
return `${adm()?`<div class="card"><div class="row"><input id="n1" placeholder="Nama lengkap"><input id="n2" placeholder="NIS/NISN"><input id="n3" placeholder="Kelas"><input id="n4" placeholder="Regu"><button class="btn" onclick="addStu()">Tambah</button></div></div>`:''}<div class="card"><div class="row"><input placeholder="Cari nama, kelas, regu…" value="${esc(q)}" oninput="q=this.value;pg=0;rs()" id="qs"><button class="btn o noprint" onclick="print()">Cetak Kartu</button></div><div id="sl">${stuList(l,pp,pgs)}</div></div>`},
his(){const l=db.att.filter(a=>!fs||a.sid==fs).slice().reverse();return `<div class="card"><div class="row"><select onchange="fs=this.value;render()"><option value="">Semua sesi</option>${db.sessions.map(s=>`<option value="${s.id}" ${fs==s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select><button class="btn o" onclick="csv()">Unduh CSV</button><button class="btn o" onclick="print()">Cetak / PDF</button></div><div class="sc"><table><tr><th>Waktu</th><th>Nama</th><th>Kelas</th><th>Regu</th><th>Lokasi</th><th>Status</th></tr>${l.map(a=>`<tr><td>${dt(a.t)}</td><td>${esc(a.name)}</td><td>${esc(a.cls)}</td><td>${esc(a.regu)}</td><td>${a.lat?a.lat.toFixed(4)+', '+a.lng.toFixed(4):'-'}</td><td><span class="tag">Hadir</span></td></tr>`).join('')||'<tr><td colspan=6>Belum ada data</td></tr>'}</table></div></div>`},
gur(){return `<div class="card"><div class="row"><input id="g1" placeholder="Nama guru"><input id="g2" placeholder="Username"><input id="g3" placeholder="Password"><button class="btn" onclick="addGur()">Tambah</button></div></div><div class="card sc"><table><tr><th>Nama</th><th>Username</th><th>Peran</th><th></th></tr>${db.teachers.map((t,i)=>`<tr><td>${esc(t.n)}</td><td>${esc(t.u)}</td><td>${t.r}</td><td>${t.r=='guru'?`<button class="btn r s" onclick="db.teachers.splice(${i},1);save();render()">Hapus</button>`:''}</td></tr>`).join('')}</table></div>`},
cfg(){const c=db.cfg;return `<div class="card"><div class="row"><input id="c0" value="${esc(c.school)}" placeholder="Nama sekolah"></div><div class="row"><input id="c1" value="${c.lat}" placeholder="Latitude"><input id="c2" value="${c.lng}" placeholder="Longitude"><input id="c3" value="${c.rad}" placeholder="Radius (m)"></div><div class="row"><button class="btn o" onclick="myLoc()">Gunakan lokasi saya sekarang</button><select id="c4"><option value="1" ${c.on?'selected':''}>Validasi GPS aktif</option><option value="0" ${c.on?'':'selected'}>Validasi GPS nonaktif (uji coba)</option></select></div><div class="row"><button class="btn" onclick="saveCfg()">Simpan</button></div><small style="color:var(--mu)">Berdirilah di titik pusat sekolah, lalu tekan “Gunakan lokasi saya”.</small></div>`}};
function recent(){return db.att.slice(-5).reverse().map(a=>`<tr><td>${dt(a.t)}</td><td>${esc(a.name)}</td><td>${esc(a.cls)}</td></tr>`).join('')||'<tr><td>Belum ada</td></tr>'}
function stuList(l,pp,pgs){return `<div class="cards">${l.slice(pg*pp,pg*pp+pp).map(s=>`<div class="idc"><h4>KARTU ANGGOTA PRAMUKA</h4><div class="qr" data-c="PRAMUKA:${s.no}"></div><b>${esc(s.name)}</b><small>${esc(s.no)} · NIS ${esc(s.nis)}<br>${esc(s.cls)} · Regu ${esc(s.regu)}</small>${adm()?`<br><button class="btn r s noprint" style="margin-top:6px" onclick="delStu('${s.no}')">Hapus</button>`:''}</div>`).join('')||'Tidak ada data'}</div><div class="row noprint" style="margin-top:12px;justify-content:center"><button class="btn o s" onclick="pg=Math.max(0,pg-1);rs()">‹</button><span style="flex:0">${pg+1}/${pgs}</span><button class="btn o s" onclick="pg=Math.min(${pgs-1},pg+1);rs()">›</button></div>`}
function rs(){const l=db.students.filter(s=>(s.name+s.nis+s.cls+s.regu+s.no).toLowerCase().includes(q.toLowerCase())),pp=8,pgs=Math.max(1,Math.ceil(l.length/pp));pg=Math.min(pg,pgs-1);$('#sl').innerHTML=stuList(l,pp,pgs);qrs()}
function addStu(){const v=[1,2,3,4].map(i=>$('#n'+i).value.trim());if(v.some(x=>!x))return toast('Lengkapi semua kolom','warn');const n=Math.max(0,...db.students.map(s=>+s.no.slice(4)))+1;db.students.push({name:v[0],nis:v[1],cls:v[2],regu:v[3],no:'PRM-'+String(n).padStart(4,'0')});save();render()}
function delStu(no){if(confirm('Hapus anggota ini?')){db.students=db.students.filter(s=>s.no!=no);save();render()}}
function addSes(){const n=$('#sn').value.trim();if(!n)return toast('Isi nama kegiatan','warn');const s={id:Date.now(),name:n,t:Date.now(),open:true,by:user.n};db.sessions.push(s);sesId=s.id;save();render()}
function closeSes(id){db.sessions.find(s=>s.id==id).open=false;save();render()}
function useSes(id){sesId=id;go('scan')}
function addGur(){const v=[1,2,3].map(i=>$('#g'+i).value.trim());if(v.some(x=>!x)||db.teachers.some(t=>t.u==v[1]))return toast('Data tidak valid atau username sudah ada','warn');db.teachers.push({n:v[0],u:v[1],p:v[2],r:'guru'});save();render()}
async function myLoc(){try{const c=await gps();$('#c1').value=c.latitude.toFixed(6);$('#c2').value=c.longitude.toFixed(6);toast('Lokasi terisi')}catch(e){toast('Izin lokasi ditolak/gagal','err')}}
function saveCfg(){db.cfg={school:$('#c0').value,lat:+$('#c1').value,lng:+$('#c2').value,rad:+$('#c3').value||100,on:$('#c4').value=='1'};save();toast('Pengaturan disimpan')}
async function startScan(){const o=db.sessions.filter(s=>s.open);if(!sesId||!o.some(s=>s.id==sesId))sesId=o.length?o[o.length-1].id:null;if(!window.Html5Qrcode)return;try{scn=new Html5Qrcode('reader');await scn.start({facingMode:'environment'},{fps:10,qrbox:220},proc,()=>{})}catch(e){toast('Kamera tidak dapat diakses. Gunakan input manual.','warn')}}
async function proc(code){if(lock)return;lock=true;setTimeout(()=>lock=false,2500);
const s=db.sessions.find(x=>x.id==sesId&&x.open);if(!s)return toast('Pilih sesi yang aktif dulu','err');
const st=db.students.find(x=>'PRAMUKA:'+x.no==code);if(!st)return toast('QR Code tidak dikenali','err');
if(db.att.some(a=>a.sid==s.id&&a.no==st.no))return toast(st.name+' sudah absen di sesi ini','warn');
let lat=null,lng=null;if(db.cfg.on){try{const c=await gps(),d=dist(c.latitude,c.longitude,db.cfg.lat,db.cfg.lng);if(d>db.cfg.rad)return toast('Ditolak: di luar area sekolah ('+Math.round(d)+' m)','err');lat=c.latitude;lng=c.longitude}catch(e){return toast('Lokasi tidak terbaca. Aktifkan izin GPS.','err')}}
db.att.push({sid:s.id,no:st.no,name:st.name,cls:st.cls,regu:st.regu,t:Date.now(),by:user.n,lat,lng});save();toast('✓ '+st.name+' ('+st.cls+') hadir');const r=$('#rs');if(r)r.innerHTML=recent()}
function csv(){const l=db.att.filter(a=>!fs||a.sid==fs),t='Waktu,No,Nama,Kelas,Regu,Lat,Lng,Petugas\n'+l.map(a=>[dt(a.t),a.no,a.name,a.cls,a.regu,a.lat||'',a.lng||'',a.by].map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n');try{const u=URL.createObjectURL(new Blob([t],{type:'text/csv'})),a=document.createElement('a');a.href=u;a.download='absensi-pramuka.csv';a.click()}catch(e){toast('Unduh tidak didukung di sini','warn')}}
load();render();
</script></body></html>
