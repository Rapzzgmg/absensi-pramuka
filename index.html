<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Pramuka Attendance System</title><meta name="color-scheme" content="light dark">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
:root{--bg:#eaf4ee;--card:#fff;--tx:#10261b;--mu:#5b7266;--g:#065f46;--e:#10b981;--au:#d4a72c;--bd:#d6e6dc;--rd:#ef4444;--bt:#fff;--b1:#047857;--b2:#10b981;--H:#10b981;--I:#3b82f6;--S:#f59e0b;--A:#ef4444;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#0a130e;--card:#14221a;--tx:#e8f2ec;--mu:#8fa89a;--bd:#223a2c;--g:#34d399;--bt:#04150d;--b1:#10b981;--b2:#34d399}}
*{box-sizing:border-box}html,body{margin:0}body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
.side{position:fixed;inset:0 auto 0 0;width:226px;background:linear-gradient(180deg,#022c1e,#065f46 70%,#0b7a52);color:#fff;padding:18px 12px;display:flex;flex-direction:column;gap:4px;padding-top:calc(18px + env(safe-area-inset-top,0px));border-right:3px solid var(--au)}
.brand{font-weight:800;font-size:15px;line-height:1.25;padding:0 8px 14px}.brand small{display:block;color:#f2d675;font-weight:600;font-size:10px;margin-top:4px}
.nav{background:none;border:0;color:#d3efe0;text-align:left;padding:11px 12px;border-radius:12px;cursor:pointer;white-space:nowrap;font-weight:600}.nav.on{background:linear-gradient(135deg,#d4a72c,#f2d675);color:#2b2200}.nav:hover:not(.on){background:rgba(255,255,255,.14)}
main{margin-left:226px;padding:0 22px 40px}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 0;gap:10px;flex-wrap:wrap}.top h1{margin:0;font-size:21px}.top span{color:var(--mu);font-size:12px}
.hero{background:linear-gradient(135deg,#064e3b,#059669 62%,#d4a72c);color:#fff;border-radius:18px;padding:20px;margin-bottom:14px}.hero h2{margin:0 0 4px;font-size:19px}.hero p{margin:0;opacity:.9}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(6,95,70,.06)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin-bottom:14px}.stat{border-top:4px solid var(--c);margin:0}.stat i{font-style:normal;font-size:22px}.stat b{display:block;font-size:26px;color:var(--c)}.stat span{color:var(--mu);font-size:12px}
.btn{background:linear-gradient(135deg,var(--b1),var(--b2));color:var(--bt);border:0;border-radius:12px;padding:10px 15px;font-weight:700;cursor:pointer}.btn.o{background:none;color:var(--g);border:1.5px solid var(--g)}.btn.r{background:var(--rd);color:#fff}.btn.s{padding:5px 10px;font-size:12px}
input,select,textarea{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.row>*{flex:1;min-width:120px}.row>.btn{flex:0 0 auto}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--bd);font-size:13px;vertical-align:middle}th{color:var(--mu);font-weight:600;font-size:12px}.sc{overflow-x:auto}
.bars{display:flex;align-items:flex-end;gap:10px;height:140px}.bars div{flex:1;text-align:center;font-size:11px;color:var(--mu)}.bars i{display:block;background:linear-gradient(var(--au),var(--e));border-radius:8px 8px 0 0;margin-bottom:4px}
.tag{background:rgba(212,167,44,.2);color:var(--g);border-radius:20px;padding:2px 9px;font-size:11px;font-weight:700}
.H{--c:var(--H)}.I{--c:var(--I)}.S{--c:var(--S)}.A{--c:var(--A)}
.ch{background:var(--c,#888);color:#fff;border-radius:20px;padding:3px 11px;font-size:11px;font-weight:700}
.sb{border:1.5px solid var(--c);background:none;color:var(--c);border-radius:9px;padding:7px 11px;font-weight:800;cursor:pointer}.sb.on{background:var(--c);color:#fff}
.mb{display:inline-block;min-width:28px;text-align:center;background:var(--c);color:#fff;border-radius:8px;padding:3px 7px;font-weight:700;font-size:12px;margin-right:3px}
.cbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.cb{background:var(--c);color:#fff;border-radius:14px;padding:12px 4px;text-align:center;font-size:12px;font-weight:600}.cb b{display:block;font-size:24px}
.pbar{height:10px;background:var(--bd);border-radius:10px;overflow:hidden;margin:6px 0}.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--au),var(--e))}
.lk{background:none;border:0;padding:0;font-weight:700;color:var(--g);text-align:left;cursor:pointer;text-decoration:underline}
#reader{width:100%;max-width:380px;margin:0 auto;border-radius:14px;overflow:hidden}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:12px 18px;border-radius:12px;color:#fff;font-weight:600;z-index:9;max-width:90%;display:none}
#pop{position:fixed;inset:0;background:rgba(3,25,15,.6);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.pc{background:var(--card);border-radius:24px;padding:26px 22px;width:100%;max-width:340px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:pp .22s ease}.pc.big{text-align:left;max-width:420px;max-height:86vh;overflow:auto}.pc h3{margin:8px 0 4px;font-size:19px}.pc p{margin:0 0 16px;color:var(--mu)}
.pi{width:76px;height:76px;border-radius:50%;margin:0 auto;color:#fff;font-size:42px;font-weight:800;display:flex;align-items:center;justify-content:center}
@keyframes pp{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}.idc{border:2px solid var(--au);border-radius:14px;padding:12px;text-align:center;background:var(--card)}.idc h4{margin:0;font-size:11px;color:var(--g)}.idc .qr{display:flex;justify-content:center;margin:8px 0;background:#fff;padding:6px;border-radius:8px}.idc b{display:block}.idc small{color:var(--mu)}
.login{max-width:380px;margin:6vh auto;padding:0 16px}.login .hero{text-align:center}.login .hero h1{margin:6px 0;font-size:20px}
@media(max-width:760px){.side{position:static;width:auto;flex-direction:row;overflow-x:auto;padding:10px;padding-top:calc(10px + env(safe-area-inset-top,0px));border-right:0;border-bottom:3px solid var(--au)}.brand{display:none}main{margin:0;padding:0 14px 40px}}
@media print{.side,.top .btn,.noprint{display:none!important}main{margin:0}}
</style></head><body><div id="app"></div><div id="toast"></div><div id="pop" onclick="closePop()"></div>
<script>
const SB='https://vomjititinutekywteyo.supabase.co/rest/v1/kv',PK='sb_publishable_BmTttkSE0j-anjHVklMilA_T8QEuNoH';
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let db=null,user=null,view='dash',q='',pg=0,fs='',scn=null,lock=false,sesId=null,busy=false,sdId=null,htab='rekap',rq='',pt;
async function api(p,o){o=o||{};const r=await fetch(SB+p,{method:o.method||'GET',body:o.body,headers:Object.assign({apikey:PK,'Content-Type':'application/json'},o.headers||{})});if(!r.ok){const e=new Error('HTTP '+r.status);e.status=r.status;throw e}const t=await r.text();return t?JSON.parse(t):null}
async function fetchAll(){let all=[],o=0;for(;;){const p=await api('?select=k,v&order=k&limit=1000&offset='+o);all=all.concat(p);if(p.length<1000)break;o+=1000}return all}
function build(rows){const d={students:[],teachers:[],sessions:[],att:[],cfg:null};rows.forEach(r=>{const p=r.k.split(':')[0];if(p=='stu')d.students.push(r.v);else if(p=='gur')d.teachers.push(r.v);else if(p=='ses')d.sessions.push(r.v);else if(p=='att')d.att.push(r.v);else if(r.k=='cfg')d.cfg=r.v});d.sessions.sort((a,b)=>a.t-b.t);d.att.sort((a,b)=>a.t-b.t);d.students.sort((a,b)=>a.no<b.no?-1:1);return d}
const put=(k,v)=>api('',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({k,v})});
const insMany=a=>api('',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(a)});
const del=k=>api('?k=eq.'+encodeURIComponent(k),{method:'DELETE'});
async function sync(){db=build(await fetchAll())}

function toast(m,t){const e=$('#toast');e.textContent=m;e.style.background=t=='err'?'#dc2626':t=='warn'?'#b7791f':'#0b5d3b';e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',3200)}
const dt=t=>new Date(t).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'});
const adm=()=>user&&user.r=='admin';
async function act(f){if(busy)return;busy=true;try{await f()}catch(e){toast(e.status==409?'Data sudah ada':'Gagal terhubung ke server','err')}busy=false}
function gps(){return new Promise((ok,no)=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>ok(p.coords),no,{enableHighAccuracy:true,timeout:12000,maximumAge:0}):no())}
function dist(a,b,c,d){const R=6371e3,r=x=>x*Math.PI/180,h=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function login(){const u=db.teachers.find(t=>t.u==$('#lu').value.trim()&&t.p==$('#lp').value);if(!u)return toast('Username atau password salah','err');user=u;view='dash';render()}
async function go(v){await stopScan();view=v;q='';pg=0;try{await sync()}catch(e){toast('Gagal memuat data terbaru','warn')}render()}
async function stopScan(){if(scn){try{await scn.stop()}catch(e){}scn=null}}
function logout(){stopScan();user=null;render()}
const RL={admin:'Super Admin',guru:'Pembina',pradana:'Pradana'},STS=[['H','Hadir'],['I','Izin'],['S','Sakit'],['A','Alpa']];
const canEdit=()=>user&&(user.r=='admin'||user.r=='guru'),stOf=a=>a.status||'Hadir';
const amap=()=>{const m={};db.att.forEach(a=>m[a.sid+':'+a.no]=a);return m};
function rekap(){const m=amap();return db.students.map(s=>{const r={s,H:0,I:0,S:0,A:0};db.sessions.forEach(se=>{const a=m[se.id+':'+s.no];if(a)r[stOf(a)[0]]++;else if(!se.open)r.A++});r.tot=r.H+r.I+r.S+r.A;r.pct=r.tot?Math.round(r.H/r.tot*100):0;return r})}
function pop(type,title,msg){const c={ok:['✓','#10b981'],err:['✕','#ef4444'],warn:['!','#f59e0b']}[type];$('#pop').innerHTML=`<div class="pc" onclick="event.stopPropagation()"><div class="pi" style="background:${c[1]}">${c[0]}</div><h3>${esc(title)}</h3><p>${esc(msg||'')}</p><button class="btn" onclick="closePop()">OK</button></div>`;$('#pop').style.display='flex';clearTimeout(pt);pt=setTimeout(closePop,type=='ok'?2200:4500)}
function modal(h){clearTimeout(pt);$('#pop').innerHTML=`<div class="pc big" onclick="event.stopPropagation()">${h}</div>`;$('#pop').style.display='flex'}
function closePop(){$('#pop').style.display='none';setTimeout(()=>lock=false,700)}
async function init(){try{await sync();
if(!db.cfg&&!db.teachers.length){await put('cfg',{school:'Nama Sekolah',lat:-6.2,lng:106.816,rad:100,on:true,m2:1});await put('gur:admin',{u:'admin',p:'admin123',n:'Super Admin',r:'admin'});await put('gur:guru',{u:'guru',p:'guru123',n:'Kak Halimah',r:'guru'});await put('gur:murid',{u:'murid',p:'murid123',n:'Pradana',r:'pradana'});await sync()}
else if(db.cfg&&!db.cfg.m2){const g=db.teachers.find(t=>t.u=='guru');if(g&&g.n=='Pembina Budi')await put('gur:guru',Object.assign({},g,{n:'Kak Halimah'}));if(!db.teachers.some(t=>t.r=='pradana'))await put('gur:murid',{u:'murid',p:'murid123',n:'Pradana',r:'pradana'});await put('cfg',Object.assign({},db.cfg,{m2:1}));await sync()}}catch(e){db=null}render()}
function render(){
if(!db){$('#app').innerHTML=`<div class="login"><div class="hero"><h1>Tidak terhubung</h1><p>Server data tidak dapat dijangkau. Periksa internet Anda.</p></div><button class="btn" onclick="init()">Coba lagi</button></div>`;return}
if(!user){$('#app').innerHTML=`<div class="login"><div class="hero"><div style="font-size:44px">⚜️</div><h1>PRAMUKA ATTENDANCE SYSTEM</h1><p>Disiplin, Terdata, dan Terintegrasi.</p></div><div class="card"><div class="row"><input id="lu" placeholder="Username" autocapitalize="none"></div><div class="row"><input id="lp" type="password" placeholder="Password"></div><div class="row"><button class="btn" onclick="login()" style="width:100%">Masuk</button></div></div></div>`;return}
const nav=[['dash','🏠 Dashboard'],['scan','📷 Scan QR'],['ses','📋 Sesi'],['stu','👥 Anggota'],['his','📊 Riwayat']].concat(adm()?[['gur','🔑 Akun'],['cfg','📍 Lokasi']]:[]),cur=view=='sd'?'ses':view,t=view=='sd'?'Detail Sesi':nav.find(n=>n[0]==cur)[1].slice(3);
$('#app').innerHTML=`<aside class="side"><div class="brand">⚜️ PRAMUKA<br>ATTENDANCE<small>Disiplin, Terdata, Terintegrasi</small></div>${nav.map(n=>`<button class="nav ${cur==n[0]?'on':''}" onclick="go('${n[0]}')">${n[1]}</button>`).join('')}<button class="nav" onclick="logout()">🚪 Keluar</button></aside><main><div class="top"><div><h1>${t}</h1><span>${new Date().toLocaleDateString('id-ID',{dateStyle:'full'})}</span></div><span>${esc(user.n)} · <span class="tag">${RL[user.r]}</span></span></div><div id="v"></div></main>`;
rv();if(view=='scan')startScan()}
function rv(){$('#v').innerHTML=V[view]();if(view=='stu')qrs()}
function qrs(){document.querySelectorAll('.qr[data-c]').forEach(e=>{e.innerHTML='';try{new QRCode(e,{text:e.dataset.c,width:120,height:120})}catch(x){}})}
const mb=(r,k)=>`<span class="mb ${k}">${r[k]}</span>`;
function rekapRows(){const f=rekap().filter(r=>(r.s.name+r.s.cls+r.s.regu).toLowerCase().includes(rq.toLowerCase()));return f.map(r=>`<tr><td><button class="lk" onclick="showRekap('${r.s.no}')">${esc(r.s.name)}</button><br><small style="color:var(--mu)">${esc(r.s.cls)} · Sangga ${esc(r.s.regu)}</small></td><td>${STS.map(x=>mb(r,x[0])).join('')}</td><td><b>${r.pct}%</b></td></tr>`).join('')||'<tr><td colspan=3>Belum ada data</td></tr>'}
function showRekap(no){const r=rekap().find(x=>x.s.no==no),m=amap(),s=r.s;const l=db.sessions.slice().reverse().map(se=>{const a=m[se.id+':'+no],v=a?stOf(a):(se.open?null:'Alpa');return `<tr><td>${esc(se.name)}<br><small style="color:var(--mu)">${dt(se.t)}</small></td><td>${v?`<span class="ch ${v[0]}">${v}</span>`:'<small>Belum</small>'}</td></tr>`}).join('');
modal(`<h3 style="margin-top:0">${esc(s.name)}</h3><small style="color:var(--mu)">${esc(s.cls)} · Sangga ${esc(s.regu)} · ${s.no}</small><div class="cbs">${STS.map(x=>`<div class="cb ${x[0]}"><b>${r[x[0]]}</b>${x[1]}</div>`).join('')}</div><b>${r.pct}% kehadiran dari ${r.tot} sesi</b><div class="pbar"><i style="width:${r.pct}%"></i></div><div class="sc" style="max-height:34vh;overflow:auto;margin:8px 0"><table>${l||'<tr><td>Belum ada sesi</td></tr>'}</table></div><button class="btn" onclick="closePop()" style="width:100%">Tutup</button>`)}
function setSt(sid,no,status){act(async()=>{const st=db.students.find(x=>x.no==no),ex=db.att.find(a=>a.sid==sid&&a.no==no),rec=Object.assign({sid,no,name:st.name,cls:st.cls,regu:st.regu,t:Date.now(),lat:null,lng:null},ex||{},{status,by:user.n});await put('att:'+sid+':'+no,rec);if(ex)Object.assign(ex,rec);else db.att.push(rec);rv()})}
function openSes(id){sdId=id;go('sd')}
const V={
dash(){const today=new Date().toDateString(),ta=db.att.filter(a=>stOf(a)=='Hadir'&&new Date(a.t).toDateString()==today).length,R=rekap(),h=R.reduce((n,r)=>n+r.H,0),d=R.reduce((n,r)=>n+r.tot,0),last=db.sessions.slice(-7),mx=Math.max(1,db.students.length),m=amap();
return `<div class="hero"><h2>Salam Pramuka, ${esc(user.n)}! ⚜️</h2><p>${esc(db.cfg.school)} · ${db.sessions.filter(s=>s.open).length} sesi sedang dibuka</p></div><div class="grid"><div class="card stat" style="--c:#059669"><i>👥</i><b>${db.students.length}</b><span>Anggota</span></div><div class="card stat" style="--c:#d4a72c"><i>📋</i><b>${db.sessions.length}</b><span>Sesi kegiatan</span></div><div class="card stat" style="--c:#3b82f6"><i>✅</i><b>${ta}</b><span>Hadir hari ini</span></div><div class="card stat" style="--c:#ef4444"><i>📈</i><b>${d?Math.round(h/d*100):0}%</b><span>Rata-rata hadir</span></div></div><div class="card"><b>Kehadiran 7 sesi terakhir</b><br><br>${last.length?`<div class="bars">${last.map(s=>{const n=db.att.filter(a=>a.sid==s.id&&stOf(a)=='Hadir').length;return `<div><i style="height:${Math.max(4,n/mx*110)}px"></i>${n}<br>${esc(s.name.slice(0,8))}</div>`}).join('')}</div>`:'<span style="color:var(--mu)">Belum ada sesi. Buat di menu Sesi.</span>'}</div>`},
ses(){return `<div class="card"><div class="row"><input id="sn" placeholder="Nama kegiatan, mis. Latihan Rutin Jumat"><button class="btn" onclick="addSes()">Buat Sesi</button></div></div><div class="card sc"><table><tr><th>Kegiatan</th><th>Hadir</th><th>Status</th><th></th></tr>${db.sessions.slice().reverse().map(s=>`<tr><td><b>${esc(s.name)}</b><br><small style="color:var(--mu)">${dt(s.t)}</small></td><td>${db.att.filter(a=>a.sid==s.id&&stOf(a)=='Hadir').length}</td><td><span class="tag">${s.open?'Dibuka':'Selesai'}</span></td><td style="white-space:nowrap"><button class="btn o s" onclick="openSes(${s.id})">${canEdit()?'Kelola':'Detail'}</button> ${s.open?`<button class="btn s" onclick="useSes(${s.id})">Scan</button> <button class="btn r s" onclick="closeSes(${s.id})">Tutup</button>`:''}</td></tr>`).join('')||'<tr><td colspan=4>Belum ada sesi</td></tr>'}</table></div>`},
sd(){const s=db.sessions.find(x=>x.id==sdId);if(!s)return '<div class="card">Sesi tidak ditemukan</div>';const m=amap(),ed=canEdit(),c={H:0,I:0,S:0,A:0,B:0};
const rows=db.students.map(st=>{const a=m[s.id+':'+st.no],v=a?stOf(a):null;c[v?v[0]:'B']++;return `<tr><td><b>${esc(st.name)}</b><br><small style="color:var(--mu)">${esc(st.cls)} · Sangga ${esc(st.regu)}</small></td><td style="text-align:right;white-space:nowrap">${ed?STS.map(x=>`<button class="sb ${x[0]} ${v==x[1]?'on':''}" onclick="setSt(${s.id},'${st.no}','${x[1]}')">${x[0]}</button>`).join(' '):(v?`<span class="ch ${v[0]}">${v}</span>`:'<small>Belum</small>')}</td></tr>`}).join('');
return `<div class="row"><button class="btn o" onclick="go('ses')">‹ Kembali</button></div><div class="card"><b>${esc(s.name)}</b><br><small style="color:var(--mu)">${dt(s.t)} · ${s.open?'Dibuka':'Selesai'}</small><div class="cbs">${STS.map(x=>`<div class="cb ${x[0]}"><b>${c[x[0]]}</b>${x[1]}</div>`).join('')}</div>${ed?'<small style="color:var(--mu)">H = Hadir · I = Izin · S = Sakit · A = Alpa. Ketuk huruf untuk mengubah keterangan. Anggota yang belum ditandai dihitung Alpa setelah sesi ditutup.</small>':''}</div><div class="card sc"><table>${rows||'<tr><td>Belum ada anggota</td></tr>'}</table></div>`},
scan(){const o=db.sessions.filter(s=>s.open);return `<div class="card"><div class="row"><select id="ss" onchange="sesId=+this.value">${o.map(s=>`<option value="${s.id}" ${s.id==sesId?'selected':''}>${esc(s.name)}</option>`).join('')||'<option value="">Tidak ada sesi aktif</option>'}</select></div><div id="reader"></div><div class="row" style="margin-top:10px"><input id="man" placeholder="Input manual: nomor anggota (PRM-0001)"><button class="btn o" onclick="proc('PRAMUKA:'+$('#man').value.trim().toUpperCase())">Kirim</button></div><small style="color:var(--mu)">Absen hanya diproses jika perangkat berada dalam radius sekolah (${db.cfg.on?db.cfg.rad+' m':'validasi GPS nonaktif'}).</small></div><div class="card"><b>Hasil scan terbaru</b><div class="sc"><table id="rs">${recent()}</table></div></div>`},
stu(){const l=db.students.filter(s=>(s.name+s.nis+s.cls+s.regu+s.no).toLowerCase().includes(q.toLowerCase())),pp=8,pgs=Math.max(1,Math.ceil(l.length/pp));pg=Math.min(pg,pgs-1);
return `${adm()?`<div class="card"><div class="row"><input id="n1" placeholder="Nama lengkap"><input id="n2" placeholder="NIS/NISN"><input id="n3" placeholder="Kelas"><input id="n4" placeholder="Sangga"><button class="btn" onclick="addStu()">Tambah</button></div><details><summary style="cursor:pointer;color:var(--g);font-weight:700">Tambah banyak sekaligus</summary><textarea id="bulk" rows="5" style="margin-top:8px" placeholder="Satu anggota per baris:\nNama;NIS;Kelas;Sangga"></textarea><div class="row" style="margin-top:8px"><button class="btn" onclick="bulkStu()">Impor</button></div></details></div>`:''}<div class="card"><div class="row"><input placeholder="Cari nama, kelas, sangga…" value="${esc(q)}" oninput="q=this.value;pg=0;rs()" id="qs"><button class="btn o noprint" onclick="print()">Cetak Kartu</button></div><div id="sl">${stuList(l,pp,pgs)}</div></div>`},
his(){const l=db.att.filter(a=>!fs||a.sid==fs).slice().reverse();return `<div class="card"><div class="row"><button class="btn ${htab=='rekap'?'':'o'}" onclick="htab='rekap';rv()">Rekap Anggota</button><button class="btn ${htab=='log'?'':'o'}" onclick="htab='log';rv()">Log Absensi</button><button class="btn o" onclick="csv()">Unduh CSV</button></div>${htab=='rekap'?`<div class="row"><input placeholder="Cari nama, kelas, sangga…" value="${esc(rq)}" oninput="rq=this.value;$('#rk').innerHTML=rekapRows()"></div><small style="color:var(--mu)">Ketuk nama untuk melihat rincian. <span class="mb H">H</span>Hadir <span class="mb I">I</span>Izin <span class="mb S">S</span>Sakit <span class="mb A">A</span>Alpa</small><div class="sc"><table><tr><th>Nama</th><th>H · I · S · A</th><th>%</th></tr><tbody id="rk">${rekapRows()}</tbody></table></div>`:`<div class="row"><select onchange="fs=this.value;rv()"><option value="">Semua sesi</option>${db.sessions.map(s=>`<option value="${s.id}" ${fs==s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div><div class="sc"><table><tr><th>Waktu</th><th>Nama</th><th>Kelas</th><th>Sangga</th><th>Status</th></tr>${l.map(a=>`<tr><td>${dt(a.t)}</td><td>${esc(a.name)}</td><td>${esc(a.cls)}</td><td>${esc(a.regu)}</td><td><span class="ch ${stOf(a)[0]}">${stOf(a)}</span></td></tr>`).join('')||'<tr><td colspan=5>Belum ada data</td></tr>'}</table></div>`}</div>`},
gur(){return `<div class="card"><div class="row"><input id="g1" placeholder="Nama"><input id="g2" placeholder="Username" autocapitalize="none"><input id="g3" placeholder="Password"><select id="g4"><option value="guru">Pembina</option><option value="pradana">Pradana</option></select><button class="btn" onclick="addGur()">Tambah</button></div></div><div class="card sc"><table><tr><th>Nama</th><th>Username</th><th>Peran</th><th></th></tr>${db.teachers.map((t,i)=>`<tr><td>${esc(t.n)}</td><td>${esc(t.u)}</td><td>${RL[t.r]||t.r}</td><td>${t.r!='admin'?`<button class="btn r s" onclick="delGur(${i})">Hapus</button>`:''}</td></tr>`).join('')}</table></div>`},
cfg(){const c=db.cfg;return `<div class="card"><div class="row"><input id="c0" value="${esc(c.school)}" placeholder="Nama sekolah"></div><div class="row"><input id="c1" value="${c.lat}" placeholder="Latitude"><input id="c2" value="${c.lng}" placeholder="Longitude"><input id="c3" value="${c.rad}" placeholder="Radius (m)"></div><div class="row"><button class="btn o" onclick="myLoc()">Gunakan lokasi saya sekarang</button><select id="c4"><option value="1" ${c.on?'selected':''}>Validasi GPS aktif</option><option value="0" ${c.on?'':'selected'}>Validasi GPS nonaktif (uji coba)</option></select></div><div class="row"><button class="btn" onclick="saveCfg()">Simpan</button></div><small style="color:var(--mu)">Berdirilah di titik pusat sekolah, lalu tekan “Gunakan lokasi saya”.</small></div>`}};
function recent(){return db.att.slice(-5).reverse().map(a=>`<tr><td>${dt(a.t)}</td><td>${esc(a.name)}</td><td><span class="ch ${stOf(a)[0]}">${stOf(a)}</span></td></tr>`).join('')||'<tr><td>Belum ada</td></tr>'}
function stuList(l,pp,pgs){return `<div class="cards">${l.slice(pg*pp,pg*pp+pp).map(s=>`<div class="idc"><h4>⚜️ KARTU ANGGOTA PRAMUKA</h4><div class="qr" data-c="PRAMUKA:${s.no}"></div><b>${esc(s.name)}</b><small>${esc(s.no)} · NIS ${esc(s.nis)}<br>${esc(s.cls)} · Sangga ${esc(s.regu)}</small>${adm()?`<br><button class="btn r s noprint" style="margin-top:6px" onclick="delStu('${s.no}')">Hapus</button>`:''}</div>`).join('')||'Tidak ada data'}</div><div class="row noprint" style="margin-top:12px;justify-content:center"><button class="btn o s" onclick="pg=Math.max(0,pg-1);rs()">‹</button><span style="flex:0">${pg+1}/${pgs}</span><button class="btn o s" onclick="pg=Math.min(${pgs-1},pg+1);rs()">›</button></div>`}
function rs(){const l=db.students.filter(s=>(s.name+s.nis+s.cls+s.regu+s.no).toLowerCase().includes(q.toLowerCase())),pp=8,pgs=Math.max(1,Math.ceil(l.length/pp));pg=Math.min(pg,pgs-1);$('#sl').innerHTML=stuList(l,pp,pgs);qrs()}
const nextNo=()=>Math.max(0,...db.students.map(s=>+s.no.slice(4)))+1;
const mk=(n,v)=>({name:v[0],nis:v[1],cls:v[2],regu:v[3],no:'PRM-'+String(n).padStart(4,'0')});
function addStu(){act(async()=>{const v=[1,2,3,4].map(i=>$('#n'+i).value.trim());if(v.some(x=>!x))return toast('Lengkapi semua kolom','warn');await sync();const s=mk(nextNo(),v);await insMany([{k:'stu:'+s.no,v:s}]);await sync();render();toast('Anggota ditambahkan')})}
function bulkStu(){act(async()=>{const ls=$('#bulk').value.split('\n').map(l=>l.split(/[;\t]/).map(x=>x.trim())).filter(a=>a.length>=4&&a[0]);if(!ls.length)return toast('Format: Nama;NIS;Kelas;Sangga per baris','warn');await sync();let n=nextNo();await insMany(ls.map(a=>{const s=mk(n++,a);return{k:'stu:'+s.no,v:s}}));await sync();render();toast(ls.length+' anggota ditambahkan')})}
function delStu(no){if(confirm('Hapus anggota ini?'))act(async()=>{await del('stu:'+no);await sync();render()})}
function addSes(){act(async()=>{const n=$('#sn').value.trim();if(!n)return toast('Isi nama kegiatan','warn');const s={id:Date.now(),name:n,t:Date.now(),open:true,by:user.n};await put('ses:'+s.id,s);sesId=s.id;await sync();render()})}
function closeSes(id){act(async()=>{const s=db.sessions.find(x=>x.id==id);await put('ses:'+id,Object.assign({},s,{open:false}));await sync();render()})}
function useSes(id){sesId=id;go('scan')}
function addGur(){act(async()=>{const v=[1,2,3,4].map(i=>$('#g'+i).value.trim());await sync();if(!v[0]||!v[1]||!v[2]||db.teachers.some(t=>t.u==v[1]))return toast('Data tidak valid atau username sudah ada','warn');await put('gur:'+v[1],{n:v[0],u:v[1],p:v[2],r:v[3]});await sync();render()})}
function delGur(i){const u=db.teachers[i].u;if(confirm('Hapus akun '+u+'?'))act(async()=>{await del('gur:'+u);await sync();render()})}
async function myLoc(){try{const c=await gps();$('#c1').value=c.latitude.toFixed(6);$('#c2').value=c.longitude.toFixed(6);toast('Lokasi terisi')}catch(e){toast('Izin lokasi ditolak/gagal','err')}}
function saveCfg(){act(async()=>{await put('cfg',Object.assign({},db.cfg,{school:$('#c0').value,lat:+$('#c1').value,lng:+$('#c2').value,rad:+$('#c3').value||100,on:$('#c4').value=='1'}));await sync();toast('Pengaturan disimpan')})}
async function startScan(){const o=db.sessions.filter(s=>s.open);if(!sesId||!o.some(s=>s.id==sesId))sesId=o.length?o[o.length-1].id:null;if(!window.Html5Qrcode)return;try{scn=new Html5Qrcode('reader');await scn.start({facingMode:'environment'},{fps:10,qrbox:220},proc,()=>{})}catch(e){toast('Kamera tidak dapat diakses. Gunakan input manual.','warn')}}
async function proc(code){if(lock)return;lock=true;setTimeout(()=>lock=false,8000);
const s=db.sessions.find(x=>x.id==sesId&&x.open);if(!s)return pop('warn','Belum ada sesi aktif','Buat atau pilih sesi yang dibuka terlebih dahulu.');
const st=db.students.find(x=>'PRAMUKA:'+x.no==code);if(!st)return pop('err','QR Code tidak dikenali','Kartu ini bukan milik anggota terdaftar.');
const ex=db.att.find(a=>a.sid==s.id&&a.no==st.no);if(ex)return pop('warn','Sudah tercatat',st.name+' sudah tercatat ('+stOf(ex)+') di sesi ini.');
let lat=null,lng=null;if(db.cfg.on){try{const c=await gps(),d=dist(c.latitude,c.longitude,db.cfg.lat,db.cfg.lng);if(d>db.cfg.rad)return pop('err','Di luar area sekolah','Anda berjarak ±'+Math.round(d)+' m dari titik sekolah (batas '+db.cfg.rad+' m). Absen ditolak.');lat=c.latitude;lng=c.longitude}catch(e){return pop('err','Lokasi tidak terbaca','Aktifkan izin lokasi di browser lalu coba lagi.')}}
const rec={sid:s.id,no:st.no,name:st.name,cls:st.cls,regu:st.regu,t:Date.now(),by:user.n,lat,lng,status:'Hadir'};
try{await insMany([{k:'att:'+s.id+':'+st.no,v:rec}])}catch(e){if(e.status==409)return pop('warn','Sudah tercatat',st.name+' sudah tercatat di sesi ini.');return pop('err','Gagal menyimpan','Periksa koneksi internet lalu coba lagi.')}
db.att.push(rec);pop('ok','Absen berhasil!',st.name+' · '+st.cls+' · Sangga '+st.regu);const r=$('#rs');if(r)r.innerHTML=recent()}
function csv(){let t;if(htab=='rekap')t='Nama,Kelas,Sangga,Hadir,Izin,Sakit,Alpa,Persen\n'+rekap().map(r=>[r.s.name,r.s.cls,r.s.regu,r.H,r.I,r.S,r.A,r.pct+'%'].map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n');else t='Waktu,No,Nama,Kelas,Sangga,Status,Petugas\n'+db.att.filter(a=>!fs||a.sid==fs).map(a=>[dt(a.t),a.no,a.name,a.cls,a.regu,stOf(a),a.by].map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n');try{const u=URL.createObjectURL(new Blob([t],{type:'text/csv'})),a=document.createElement('a');a.href=u;a.download='absensi-pramuka.csv';a.click()}catch(e){toast('Unduh tidak didukung di sini','warn')}}
setInterval(async()=>{if(!user||busy||document.hidden||$('#pop').style.display=='flex')return;if(!['dash','scan'].includes(view))return;try{await sync();if(view=='scan'){const r=$('#rs');if(r)r.innerHTML=recent()}else rv()}catch(e){}},15000);
init();
</script></body></html>
